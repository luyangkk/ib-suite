[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-common"
version = "0.1.0"
description = "Shared foundation for IB analyst skills: config, schema, storage, metrics, charts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "plotly>=5.20",
    "kaleido>=0.2.1",
    "ruamel.yaml>=0.18",
]

[tool.setuptools.packages.find]
include = ["ib_common*"]
